title: "Egyszerűbben is lehet"
description: "Szolgáltatások, programok, eszközök a saját nézőpontomból"
url: "https://oliversblog.github.io"
baseurl: ""
lang: hu
locale: hu_HU
timezone: Europe/Budapest
author:
  name: "Oliver"

permalink: /:title/
paginate: 10
paginate_path: /oldal/:num/

# Élesítve (4.2): false. Egyes oldalak noindexe a front matterben (robots: noindex).
site_noindex: false
# GTM-konténer (5.4). Mérőkód csak éles buildben (JEKYLL_ENV=production); ha üres, nincs mérőkód.
gtm_id: "GTM-MRKLZV37"
# Search Console (4.4 lépés): URL-előtag tulajdon, HTML-címkés ellenőrzés.
webmaster_verifications:
  google: "EU7sUYwDEGrCh4JR2U8hHbfAs0L9DPxOLWskJXBFQkE"

markdown: kramdown
highlighter: rouge

# Egyetlen tömörített CSS-fájl (assets/css/main.scss + _sass/)
sass:
  style: compressed

# A GitHub Pages alapból a jekyll-theme-primer témát és a jövőbeli dátumú
# posztok megjelenítését kapcsolja be; saját téma van, és a jövőbeli poszt
# csak a dátuma után jelenjen meg.
theme: null
future: false

# Hírcsatorna: kivonat + link a posztra (O8) – a teljes szöveg a blogon olvasható.
feed:
  excerpt_only: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: kategoria
    values:
      layout: kategoria

# Ezek soha ne kerüljenek ki az oldalra.
# A "[A-Z]*.md" a gyökérben lévő nagybetűs Markdown-fájlokat zárja ki
# (pl. README.md és a helyi munkafájlok); a tartalom slugjai kisbetűsek.
exclude:
  - docs/
  - _design/
  - _import/
  - "[A-Z]*.md"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
